[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conic-sections"
version = "0.3.0"
description = "GPU-accelerated 3D camera simulation, ray tracing, and virtual environment navigation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Brian O'Sullivan", email = "bmw.osullivan@gmail.com" },
]
keywords = [
    "computer-vision",
    "camera-calibration",
    "ray-tracing",
    "opengl",
    "3d-rendering",
    "conic-sections",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

dependencies = [
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "glfw>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "opencv-contrib-python>=4.9",
    "scipy>=1.12",
    "trimesh>=4.0",
    "Pillow>=10.0",
    "imgui-bundle>=1.5",
    "PyOpenGL>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.envs.default.scripts]
stubs = [
    "stubgen -p glfw -p moderngl -o typestubs/",
    "cp typestubs/glfw/__init__.pyi ~/Developer/typestubs/glfw/__init__.pyi",
    "cp typestubs/moderngl/__init__.pyi ~/Developer/typestubs/moderngl/__init__.pyi",
]

[project.urls]
Homepage = "https://github.com/mo-geometry/conic_sections"
Repository = "https://github.com/mo-geometry/conic_sections"
Issues = "https://github.com/mo-geometry/conic_sections/issues"

[project.scripts]
conic-sections = "conic_sections.__main__:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]
exclude = ["typestubs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["conic_sections"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

exclude = ["typestubs/"]

[[tool.mypy.overrides]]
module = [
    "moderngl.*",
    "moderngl_window.*",
    "glfw.*",
    "cv2.*",
    "trimesh.*",
    "imgui_bundle.*",
    "OpenGL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "conic_sections.__main__"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeStubs = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--cov=conic_sections",
    "--cov-report=term-missing",
]
markers = [
    "gpu: tests that require a GPU/OpenGL context (deselect with '-m \"not gpu\"')",
    "slow: tests that take more than a few seconds",
]
